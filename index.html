function handoffImport(file){
 var reader=new FileReader();
 reader.onload=function(){try{
  var data=JSON.parse(reader.result);
  if(data.format!=='alameer-rep-handoff'||data.version!==1||typeof data.repId!=='string'||!data.repId.trim()||!Array.isArray(data.rows)||data.rows.length>30000)throw Error('ملف نقل غير صالح');
  var allowed={sales:1,purchases:1,movements:1,supplierPayments:1,adjustments:1};
  data.rows.forEach(function(x){if(!x||!allowed[x.kind]||!x.record||typeof x.record!=='object'||x.record.id===undefined)throw Error('حركة غير صالحة')});
  if(!managerOK())return;
  var old=JSON.stringify(S),known={};
  S.lanInbox.forEach(function(x){known[x.key]=true});
  var added=0;
  data.rows.forEach(function(x){
   var key=JSON.stringify([data.repId,x.kind,String(x.record.id)]);
   if(!known[key]){S.lanInbox.push({key:key,repId:data.repId,kind:x.kind,record:x.record,receivedAt:Date.now()});known[key]=true;added++}
  });
  if(!persist()){S=JSON.parse(old);return}
  render();alert('تم استلام '+added+' حركة جديدة، وجرى تجاهل '+(data.rows.length-added)+' حركة مكررة. الحركات محفوظة للمراجعة ولم تُرحّل إلى الحسابات.');
 }catch(e){alert('تعذر استلام الملف: '+e.message)}};

}

async function barcodeCamera(){if(!('BarcodeDetector' in window)||!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)return alert('الكاميرا لقراءة الباركود غير مدعومة بهذا المتصفح أو من ملف HTML محلي. استخدم قارئ باركود بلوتوث أو أدخل الرقم يدوياً.');barcodeStop();var box=document.createElement('div');box.id='barcodeCamera';box.className='overlay';box.innerHTML='<div class="dialog"><h3>مسح الباركود بالكاميرا</h3><video id="barcodeVideo" autoplay playsinline muted style="width:100%;max-height:50vh;background:#111"></video><button class="btn secondary full" id="barcodeClose">إغلاق الكاميرا</button></div>';document.body.appendChild(box);el('barcodeClose').onclick=barcodeStop;try{barcodeStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});var video=el('barcodeVideo');video.srcObject=barcodeStream;await video.play();barcodeLastError='';var detector=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128','code_39','itf','qr_code']});var busy=false,detected=false;barcodeWatchdog=setTimeout(function(){if(!detected&&el('barcodeCamera')){barcodeStop();alert('لم يتم التعرف على الباركود خلال 12 ثانية. '+(barcodeLastError?'سبب القراءة: '+barcodeLastError+'\n':'')+'جرّب تصوير الباركود بوضوح أو أدخل رقمه المكتوب أسفله. بعض متصفحات أندرويد لا تدعم التعرف التلقائي داخل ملف HTML.')}},12000);barcodeTimer=setInterval(async function(){if(busy||!video||video.readyState<2)return;busy=true;try{var codes=await detector.detect(video);if(codes.length){detected=true;var val=codes[0].rawValue;barcodeStop();el('barcodeEntry').value=val;barcodeOpen(val)}}catch(e){barcodeLastError=String(e.message||e)}finally{busy=false}},350)}catch(e){barcodeStop();alert('تعذر تشغيل الكاميرا: '+e.message+'\nاستخدم الإدخال اليدوي أو قارئ بلوتوث.')}}

/* Camera photo capture works from local files on many Android browsers.
   Barcode decoding still requires browser BarcodeDetector support. */
function barcodeLoadZXing(){
 if(window.ZXing&&window.ZXing.BrowserMultiFormatReader)return Promise.resolve();
 if(window.barcodeZXingLoading)return window.barcodeZXingLoading;
 window.barcodeZXingLoading=new Promise(function(resolve,reject){
  var sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js';
  sc.onload=function(){window.ZXing&&window.ZXing.BrowserMultiFormatReader?resolve():reject(new Error('لم يتم تحميل محرك ZXing'))};
  sc.onerror=function(){reject(new Error('تعذر تنزيل محرك القراءة. افتح الإنترنت ثم أعد المحاولة'))};
  document.head.appendChild(sc);
 }).catch(function(e){window.barcodeZXingLoading=null;throw e});
 return window.barcodeZXingLoading;
}
async function barcodeReadImage(file){
 var dataUrl=await new Promise(function(resolve,reject){var r=new FileReader();r.onload=function(){resolve(r.result)};r.onerror=reject;r.readAsDataURL(file)});
 if(window.BarcodeDetector){
  try{var bm=await createImageBitmap(file);try{var ds=await new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128','code_39','itf','qr_code']}).detect(bm);if(ds.length)return ds[0].rawValue}finally{if(bm.close)bm.close()}}catch(e){}
 }
 await barcodeLoadZXing();
 var reader=new ZXing.BrowserMultiFormatReader();
 try{var result=await reader.decodeFromImageUrl(dataUrl);return result.getText?result.getText():result.text}
 finally{if(reader.reset)reader.reset()}
}
